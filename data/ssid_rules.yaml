
rules:

  - match: exact
    pattern: "Starbucks WiFi"
    expected_vendors: [Cisco, Aruba, Meraki]
    notes: "Starbucks contracts AT&T; APs are Cisco/Aruba/Meraki"
  - match: exact
    pattern: "Google Starbucks"
    expected_vendors: [Cisco, Meraki]
  - match: exact
    pattern: "attwifi"
    expected_vendors: [Pace, Arris, Cisco]
  - match: exact
    pattern: "att-wifi"
    expected_vendors: [Pace, Arris, Cisco]
  - match: exact
    pattern: "xfinitywifi"
    expected_vendors: [Cisco, Arris, Comcast]
  - match: exact
    pattern: "XFINITY"
    expected_vendors: [Cisco, Arris, Comcast]
  - match: exact
    pattern: "Xfinity Mobile"
    expected_vendors: [Cisco, Arris, Comcast, Commscope, Vantiva]
    notes: "Comcast/Xfinity Passpoint hotspot SSID broadcast by many CPE APs"
  - match: prefix
    pattern: "McDonald's"
  - match: prefix
    pattern: "McDonalds"
  - match: prefix
    pattern: "Boingo"
    expected_vendors: [Cisco, Aruba, Ruckus]
  - match: prefix
    pattern: "boingo"
  - match: prefix
    pattern: "_The UPS Store"
  - match: prefix
    pattern: "SpectrumWiFi"
    expected_vendors: [Cisco, Arris, Casa]
  - match: compound
    compound_prefix: "TWC"
    compound_suffix: "WiFi"

  - match: prefix
    pattern: "Hilton Honors"
  - match: prefix
    pattern: "Marriott_Guest"
  - match: prefix
    pattern: "Hyatt"
  - match: contains
    pattern: "IHG_Connect"
  - match: prefix
    pattern: "Delta Sky Club"
  - match: prefix
    pattern: "AmericanAirlines"
  - match: prefix
    pattern: "United_Wi-Fi"
  - match: prefix
    pattern: "gogoinflight"

  - match: prefix
    pattern: "airport"
  - match: prefix
    pattern: "Airport"
  - match: suffix
    pattern: "_airport"
  - match: prefix
    pattern: "Amtrak"

  - match: suffix
    pattern: "_Guest"
    expected_vendors: [Cisco, Aruba, Ruckus, Ubiquiti]
  - match: suffix
    pattern: " Guest"
    expected_vendors: [Cisco, Aruba, Ruckus, Ubiquiti]
  - match: suffix
    pattern: "-Guest"
  - match: suffix
    pattern: "GUEST"

  - match: prefix
    pattern: "ATT-WIFI-"
  - match: prefix
    pattern: "Verizon_"
  - match: prefix
    pattern: "Spectrum-"
  - match: prefix
    pattern: "Optimum WiFi"
  - match: prefix
